[package]
name = "mlat-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mlat-server-rs"
path = "src/main.rs"

[dependencies]
mlat-core = { path = "../mlat-core" }
mlat-proto = { path = "../mlat-proto" }
ahash = "0.8"
crossbeam-channel = "0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["full"] }

[features]
glibc-pow = ["mlat-core/glibc-pow"]
